{% extends "base.html" %}
{% block title %}{{ t('nav_map') }} — Volvo EX30 Mate{% endblock %}
{% block content_width %}w-full{% endblock %}
{% block autorefresh %}0{% endblock %}
{% block content %}
<link rel="stylesheet" href="static/vendor/leaflet/leaflet.css">
<script src="static/vendor/leaflet/leaflet.js"></script>
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white">{{ t('nav_map') }}</h1>
    <span class="text-sm text-slate-400">{{ t('last_position') }}</span>
  </div>

  <div id="map-full" style="height:calc(100vh - 160px); min-height: 500px" class="rounded-lg overflow-hidden border border-slate-700"></div>

  <script>
  (function () {
    var trips = [
      {% for tr in trips %}
      { id: {{ tr.id }}, start: [{% if tr.start_lat %}{{ tr.start_lat }}{% else %}null{% endif %}, {% if tr.start_lon %}{{ tr.start_lon }}{% else %}null{% endif %}],
        end: [{% if tr.end_lat %}{{ tr.end_lat }}{% else %}null{% endif %}, {% if tr.end_lon %}{{ tr.end_lon }}{% else %}null{% endif %}] }{% if not loop.last %},{% endif %}
      {% endfor %}
    ];
    var hasPos = {% if status and status.latitude %}true{% else %}false{% endif %};
    var center = [
      {% if status and status.latitude %}{{ status.latitude }}{% else %}38.1157{% endif %},
      {% if status and status.longitude %}{{ status.longitude }}{% else %}13.3615{% endif %}
    ];

    var map = L.map('map-full').setView(center, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var bounds = null;
    var drawn = 0;

    function drawTrip(tr, coords) {
      if (!coords || coords.length < 2) return;
      var line = L.polyline(coords, { color: '#14b8a6', weight: 4, opacity: 0.85 }).addTo(map);
      bounds = bounds ? line.getBounds().extend(bounds) : line.getBounds();
      drawn++;
    }

    function drawFallback(tr) {
      var pts = [];
      if (tr.start[0] != null) pts.push(tr.start);
      if (tr.end[0] != null) pts.push(tr.end);
      if (pts.length >= 2) drawTrip(tr, pts);
    }

    function fetchRoute(tr) {
      if (!tr.id) return drawFallback(tr);
      fetch('/api/trips/' + tr.id + '/route')
        .then(function (r) { return r.json(); })
        .then(function (d) { drawTrip(tr, d.coords); })
        .catch(function () { drawFallback(tr); });
    }

    trips.forEach(fetchRoute);

    if (hasPos) {
      L.circleMarker(center, {
        radius: 10, color: '#ffffff', weight: 2,
        fillColor: '#14b8a6', fillOpacity: 0.95
      }).addTo(map).bindPopup('Volvo EX30');
    }

    function fitBounds() {
      if (bounds) map.fitBounds(bounds, { padding: [24, 24] });
      else if (!hasPos) map.setView(center, 14);
    }

    // OSRM calls are async; wait for them before fitting.
    var tries = 0;
    var iv = setInterval(function () {
      if (drawn >= trips.length || tries++ > 20) {
        clearInterval(iv);
        fitBounds();
        map.invalidateSize();
      }
    }, 250);
  })();
  </script>
</div>
{% endblock %}
