<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
  <div class="min-w-0">
    {% include 'partials/status_metrics.html' %}
    <div class="flex flex-wrap gap-2 mt-3">
      {% for name, color, summary, readings in vehicle_indicators() %}
        <details class="text-xs">
          <summary class="cursor-pointer rounded-full px-3 py-2 text-white" style="background:{{ color }}">{{ name }}: {{ summary }}</summary>
          <ul class="mt-2 space-y-1 text-slate-200">
            {% for label, reading in readings %}<li>{{ label }}: {{ reading }}</li>{% endfor %}
          </ul>
        </details>
      {% endfor %}
    </div>
  </div>
  <img src="static/ex30_cloud_blue.jpg" width="640" height="480" class="w-full h-auto rounded-lg" alt="Volvo EX30 Cloud Blue">
</div>
