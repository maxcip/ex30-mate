{% extends "base.html" %}
{% block title %}{{ t('nav_commands') }} — Volvo EX30 Mate{% endblock %}
{% block content %}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-white">{{ t('nav_commands') }}</h1>
    <p class="text-sm text-slate-400 mt-1">{{ t('cmd_ready') }}</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for cmd in commands %}
    <div class="card">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-2xl">{{ cmd.icon }}</span>
        <div>
          <div class="font-semibold text-white">{{ cmd.label }}</div>
          <div class="text-xs text-slate-400">{{ cmd.key }}</div>
        </div>
      </div>
      <p class="text-sm text-slate-400 mb-3">{{ cmd.help }}</p>
      <button type="button" hx-post="api/command/{{ cmd.key }}"
              class="w-full rounded-lg bg-brand hover:bg-teal-500 text-white px-3 py-2 text-sm font-medium">
        {{ t('execute') }}
      </button>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
