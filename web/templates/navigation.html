{% extends "base.html" %}
{% block title %}{{ t('nav_navigation') }} — Volvo EX30 Mate{% endblock %}
{% block content %}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-white">{{ t('nav_navigation') }}</h1>
    <p class="text-sm text-slate-400 mt-1">{{ t('destination') }}</p>
  </div>

  <div class="card max-w-2xl">
    <form id="nav-form" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">{{ t('destination') }}</label>
        <input id="dest-input" type="text" name="dest"
               class="w-full rounded-lg bg-slate-800 border border-slate-700 px-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand"
               placeholder="Via Roma 1, Milano">
      </div>
      <button type="submit"
              class="rounded-lg bg-brand hover:bg-teal-500 text-white px-4 py-2 text-sm font-medium">
        {{ t('send') }}
      </button>
    </form>
    <div id="nav-result" class="mt-4 text-sm text-slate-400"></div>
  </div>

  <div id="map-full" style="height:480px" class="rounded-lg overflow-hidden border border-slate-700"></div>
  <script>
  (function () {
    var form = document.getElementById('nav-form');
    var result = document.getElementById('nav-result');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var dest = document.getElementById('dest-input').value;
      if (!dest) return;
      result.textContent = "{{ t('sending') }}";
      fetch('api/navigation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ destination: dest })
      }).then(function (r) { return r.json(); }).then(function (d) {
        result.textContent = d.message || "{{ t('sent') }}";
      }).catch(function () { result.textContent = "{{ t('error') }}"; });
    });
  })();
  </script>
</div>
{% endblock %}
